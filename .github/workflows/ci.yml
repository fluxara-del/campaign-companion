name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Testovi i build nikad ne koriste produkcijsku bazu: CI ima samo privremene datoteke.
  DATABASE_URL: file:./data/ci-build.db

jobs:
  verify:
    name: Provjere (typecheck, lint, testovi, migracije, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalacija ovisnosti
        run: npm ci --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit testovi
        run: npm run test:unit

      - name: Testovi baze i domenskih pravila
        run: npm run test:db

      - name: Provjera migracija (destruktivne naredbe, imena, lock)
        run: npm run db:migrate:check

      - name: Provjera odstupanja sheme od migracija
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Production build
        run: npm run build

      - name: Sigurnost ovisnosti (npm audit, produkcijske, high+)
        run: npm run audit:deps

  docker:
    name: Docker image i smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (bez objave)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: campaign-companion:ci
          build-args: |
            APP_VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (migracije, backup, health) na privremenom volumenu
        run: |
          set -euo pipefail
          docker volume create kdz-ci-data
          docker volume create kdz-ci-backups
          # Iste zastavice kao deploy/zimaos/deploy.sh i compose.yaml (read-only, bez mreže, bez capabilities).
          run() {
            docker run --rm --network none --user 1000:1000 --read-only --tmpfs /tmp -e HOME=/tmp \
              --security-opt no-new-privileges:true --cap-drop ALL \
              -v kdz-ci-data:/data -v kdz-ci-backups:/backups campaign-companion:ci "$@"
          }
          run node node_modules/prisma/build/index.js migrate deploy
          run node node_modules/tsx/dist/cli.mjs scripts/db/check-migrations.ts --db /data/app.db --json
          run node node_modules/tsx/dist/cli.mjs scripts/db/backup.ts --db /data/app.db --out /backups --label ci
          run node node_modules/tsx/dist/cli.mjs scripts/db/verify.ts --db /data/app.db
          # Restore probe u zasebnu datoteku (aktivna baza se ne dira).
          B="$(run sh -c 'ls -1 /backups/*.db | head -n1')"
          run node node_modules/tsx/dist/cli.mjs scripts/db/verify.ts --backup "$B"
          run node node_modules/tsx/dist/cli.mjs scripts/db/restore.ts --backup "$B" --db /data/restore-probe.db --confirm
          run node node_modules/tsx/dist/cli.mjs scripts/db/verify.ts --db /data/restore-probe.db
          docker run -d --name kdz-ci -p 127.0.0.1:3000:3000 --read-only --tmpfs /tmp --tmpfs /app/.next/cache \
            --security-opt no-new-privileges:true --cap-drop ALL -v kdz-ci-data:/data campaign-companion:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs kdz-ci
          exit 1

      - name: Čišćenje
        if: always()
        run: |
          docker rm -f kdz-ci || true
          docker volume rm kdz-ci-data kdz-ci-backups || true
