name: PR pravila

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-policy:
    name: PR pravila (Issue i faza)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # Dependabot PR-ovi su iznimka: nastaju automatski i nemaju Issue; i dalje prolaze CI i traže odobrenje vlasnika.
    # Provjerava se autor PR-a, ne pokretač događaja (vlasnik može urediti Dependabot PR).
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Provjera opisa PR-a
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          ok=true
          # Here-string umjesto `printf | grep -q`: uz pipefail grep -q prekida cijev i daje lažni neuspjeh.
          if ! grep -Eiq '(closes|fixes|resolves|refs)[[:space:]]+#[0-9]+' <<<"$BODY"; then
            echo "::error::PR mora referencirati GitHub Issue (npr. 'Closes #12' ili 'Refs #12')."; ok=false
          fi
          if ! grep -Eiq 'faza:[[:space:]]*[0-7]' <<<"$BODY"; then
            echo "::error::PR mora navesti razvojnu fazu (npr. 'Faza: 1')."; ok=false
          fi
          $ok
